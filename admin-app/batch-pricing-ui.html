<!-- ════════════════════════════════════════
     Batch Pricing Admin Tab
     Free/Paid course pricing management
════════════════════════════════════════ -->

<div id="bp-container" class="bp-container">
  <!-- Header -->
  <div class="bp-header">
    <h2>🎓 Batch Pricing Management</h2>
    <button id="bp-new-batch-btn" class="bp-btn bp-btn-primary">
      ➕ Create New Batch
    </button>
  </div>

  <!-- Batches List -->
  <div id="bp-batches-list" class="bp-batches-list">
    <div style="text-align: center; padding: 2rem; color: #999;">
      <p>Loading batches...</p>
    </div>
  </div>
</div>

<!-- Batch Form Modal -->
<div id="bp-batch-modal" class="bp-modal hidden">
  <div class="bp-modal-content">
    <div class="bp-modal-header">
      <h3 id="bp-modal-title">Create New Batch</h3>
      <button id="bp-close-btn" class="bp-modal-close" onclick="document.getElementById('bp-batch-modal').classList.add('hidden')">
        ✕
      </button>
    </div>

    <form id="bp-batch-form" class="bp-form">
      <!-- Batch Name -->
      <div class="bp-form-group">
        <label for="bp-batch-name">📚 Batch Name</label>
        <input
          id="bp-batch-name"
          type="text"
          placeholder="e.g., Physics Class 12"
          required
        />
      </div>

      <!-- Pricing Type -->
      <div class="bp-form-group">
        <label>💰 Pricing Type</label>
        <div class="bp-radio-group">
          <label class="bp-radio-label">
            <input type="radio" name="bp-pricing-type" value="free" />
            <span>🆓 Free Course</span>
          </label>
          <label class="bp-radio-label">
            <input type="radio" name="bp-pricing-type" value="paid" checked />
            <span>💳 Paid Course</span>
          </label>
        </div>
      </div>

      <!-- Pricing Fields (shown only for paid) -->
      <div id="bp-pricing-fields" class="bp-pricing-fields">
        <!-- Base Price -->
        <div class="bp-form-group">
          <label for="bp-base-price">Base Price (₹)</label>
          <input
            id="bp-base-price"
            type="number"
            min="0"
            step="1"
            placeholder="e.g., 999"
          />
        </div>

        <!-- Discount Section -->
        <div class="bp-form-section">
          <h4>🎁 Discount (Optional)</h4>

          <div class="bp-form-group">
            <label for="bp-discount-type">Discount Type</label>
            <select id="bp-discount-type">
              <option value="fixed">Fixed Amount (₹)</option>
              <option value="percentage">Percentage (%)</option>
            </select>
          </div>

          <div class="bp-form-group">
            <label for="bp-discount-value">Discount Value</label>
            <input
              id="bp-discount-value"
              type="number"
              min="0"
              step="1"
              placeholder="e.g., 100 or 10"
            />
          </div>

          <!-- Discounted Price Display -->
          <div class="bp-form-group">
            <label>💵 Final Price After Discount</label>
            <div class="bp-price-display">
              <span id="bp-discounted-price">₹0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Description -->
      <div class="bp-form-group">
        <label for="bp-description">📝 Description (Optional)</label>
        <textarea
          id="bp-description"
          placeholder="e.g., Complete physics course for JEE preparation"
          rows="3"
        ></textarea>
      </div>

      <!-- Buttons -->
      <div class="bp-form-actions">
        <button type="submit" class="bp-btn bp-btn-primary">
          💾 Save Batch
        </button>
        <button type="button" id="bp-cancel-btn" class="bp-btn bp-btn-secondary">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
