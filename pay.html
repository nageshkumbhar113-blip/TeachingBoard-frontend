<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a35" />
<title>Payment — Nks EduOrbit</title>
<link rel="icon" href="/icons/icon-72.png" />
<style>
  :root{
    --navy:#0b1a35; --navy2:#132548; --gold:#c9a227; --gold-lt:#e8c766;
    --paper:#fffaf0; --ink:#1c2333; --ink2:#5b6478;
    --good:#1a7f37; --good-bg:#e8f8ee;
    --bad:#cf222e; --bad-bg:#fdeceb;
    --border:rgba(11,26,53,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:linear-gradient(180deg,#f3f0e6,#eee9da);
    color:var(--ink); font-family:'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:380px; background:var(--paper);
    border-radius:18px; border:1px solid var(--border);
    box-shadow:0 20px 60px -20px rgba(11,26,53,0.35);
    padding:28px 24px; text-align:center;
  }
  .brand{font-size:0.72rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .title{font-size:1.15rem; font-weight:800; color:var(--navy); margin-bottom:18px;}
  .icon-wrap{
    width:56px; height:56px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; font-size:1.6rem;
  }
  .icon-wrap.loading{ background:rgba(11,26,53,0.08); }
  .icon-wrap.success{ background:var(--good-bg); color:var(--good); }
  .icon-wrap.error{ background:var(--bad-bg); color:var(--bad); }
  .status-title{font-size:1rem; font-weight:800; color:var(--navy); margin-bottom:6px;}
  .status-sub{font-size:0.85rem; color:var(--ink2); line-height:1.6; margin-bottom:18px;}
  .detail-row{
    display:flex; justify-content:space-between; font-size:0.82rem;
    padding:8px 0; border-bottom:1px solid var(--border); color:var(--ink2);
  }
  .detail-row b{color:var(--ink); font-weight:700;}
  .detail-box{margin-bottom:18px; text-align:left;}
  .btn{
    display:block; width:100%; padding:13px; border-radius:10px; border:none;
    font-weight:800; font-size:0.9rem; cursor:pointer; text-decoration:none;
  }
  .btn-primary{ background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; }
  .btn-secondary{ background:rgba(11,26,53,0.08); color:var(--navy); margin-top:10px; }
  .spinner{
    width:24px; height:24px; border-radius:50%; border:3px solid rgba(11,26,53,0.15);
    border-top-color:var(--navy); animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .hidden{ display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Nks EduOrbit</div>

    <div id="view-loading">
      <div class="icon-wrap loading"><div class="spinner"></div></div>
      <div class="status-title">Payment तयार होत आहे…</div>
      <div class="status-sub">एक क्षण थांबा</div>
    </div>

    <div id="view-details" class="hidden">
      <div class="title">Payment Details</div>
      <div class="detail-box">
        <div class="detail-row"><span>Batch</span><b id="d-batch">—</b></div>
        <div class="detail-row"><span>Plan</span><b id="d-period">—</b></div>
        <div class="detail-row"><span>Amount</span><b id="d-amount">—</b></div>
      </div>
      <button class="btn btn-primary" id="btn-pay">Pay Now</button>
    </div>

    <div id="view-success" class="hidden">
      <div class="icon-wrap success">✓</div>
      <div class="status-title">Payment झालं!</div>
      <div class="status-sub">आता ही टॅब बंद करून Nks EduOrbit app वर परत जा — तिथे लगेच access मिळेल.</div>
    </div>

    <div id="view-error" class="hidden">
      <div class="icon-wrap error">✕</div>
      <div class="status-title" id="error-title">काहीतरी चूक झाली</div>
      <div class="status-sub" id="error-sub">कृपया पुन्हा प्रयत्न करा, किंवा app मध्ये परत जाऊन पुन्हा सुरू करा.</div>
      <a class="btn btn-secondary" id="btn-retry" href="#">पुन्हा प्रयत्न करा</a>
    </div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const API_BASE = 'https://teachingboard-backend.onrender.com/api';
    const params = new URLSearchParams(window.location.search);

    const orderId  = params.get('order_id')  || '';
    const amount   = parseInt(params.get('amount'), 10) || 0; // paise
    const currency = params.get('currency') || 'INR';
    const keyId    = params.get('key_id')    || '';
    const batch    = params.get('batch')     || '';
    const period   = params.get('period')    || '';
    const name     = params.get('name')      || '';
    const contact  = params.get('contact')   || '';

    function show(viewId) {
      ['view-loading', 'view-details', 'view-success', 'view-error'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', id !== viewId);
      });
    }

    function showError(title, sub) {
      document.getElementById('error-title').textContent = title || 'काहीतरी चूक झाली';
      document.getElementById('error-sub').textContent = sub || 'कृपया पुन्हा प्रयत्न करा, किंवा app मध्ये परत जाऊन पुन्हा सुरू करा.';
      show('view-error');
    }

    async function verifyPayment(response) {
      const res = await fetch(`${API_BASE}/payment/verify-public`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          razorpay_order_id:   response.razorpay_order_id,
          razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature:  response.razorpay_signature,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        throw new Error(data.message || 'Verification failed');
      }
    }

    function openCheckout() {
      const rzp = new Razorpay({
        key: keyId,
        amount,
        currency,
        name: 'Nks EduOrbit',
        description: `${batch} — ${period === 'yearly' ? 'Yearly' : 'Monthly'}`,
        order_id: orderId,
        prefill: { name, contact },
        theme: { color: '#0b1a35' },
        handler: async (response) => {
          show('view-loading');
          document.querySelector('#view-loading .status-title').textContent = 'Payment तपासत आहे…';
          try {
            await verifyPayment(response);
            show('view-success');
          } catch (err) {
            showError('Payment झालं, पण confirm करताना अडचण आली', 'काळजी करू नका — काही मिनिटांत app मध्ये आपोआप activate होईल. अजून झालं नाही तर support ला संपर्क करा.');
          }
        },
        modal: {
          ondismiss: () => show('view-details'),
        },
      });
      rzp.on('payment.failed', () => {
        showError('Payment अयशस्वी झालं', 'तुमच्याकडून पैसे कापले गेले नाहीत. कृपया पुन्हा प्रयत्न करा.');
      });
      rzp.open();
    }

    document.getElementById('btn-pay').addEventListener('click', openCheckout);
    document.getElementById('btn-retry').addEventListener('click', e => {
      e.preventDefault();
      show('view-details');
    });

    if (!orderId || !amount || !keyId) {
      showError('Payment link अपूर्ण आहे', 'कृपया app मध्ये परत जाऊन पुन्हा Plan निवडा.');
    } else {
      document.getElementById('d-batch').textContent = batch || '—';
      document.getElementById('d-period').textContent = period === 'yearly' ? 'Yearly' : 'Monthly';
      document.getElementById('d-amount').textContent = `₹${(amount / 100).toLocaleString('en-IN')}`;
      show('view-details');
    }
  </script>
</body>
</html>
